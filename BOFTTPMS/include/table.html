<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="ja">

<head>
<title>BOF:TT 同梱譜面一覧表</title>
<meta http-equiv="Content-Script-Type" content="text/javascript" />
<meta http-equiv="Content-Style-Type" content="text/css" />
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="bmstable" content="https://pmsdatabase.github.io/BOFTTPMS/include/header.json" /> <!--　読み込む難易度表のヘッダファイルをここに指定　-->
<link href="../../style/css/style.css" rel="stylesheet" type="text/css" media="screen,print" />
<script src="../../style/js/jquery-2.0.2.min.js"></script>
</head>

<body>

<center>

<p>
<strong><span style="font-size: 18pt;">BOF:TT 同梱譜面一覧表</span></strong><br>
【色分け】緑：5KEY　青：10/14KEY　赤：9KEY<br>
【更新タイミング】不定期、パッケージ準拠を予定しています

</p>


<p>
<a href="../../BOFTTPMS.html">BOF:TT(BOF2024) PMS差分企画 難易度表に戻る</a>
</p>

</center>


<div id="table-search" class="level-jump table-search-legacy">
<label for="table-search-input">検索:</label>
<input type="text" id="table-search-input" placeholder="タイトル・作者・差分作者・md5・sha256" oninput="handleSearchInput(event)" onkeydown="handleSearchKeydown(event)" oncompositionend="handleSearchInput(event)" enterkeyhint="search" aria-describedby="table-search-mobile-help">
<span id="table-search-status"></span>
<span id="table-search-mobile-help">スマートフォンでの検索は非常に重いのでご注意ください。3文字以上入力して検索キーを押すと実行します。</span>
</div>

<!--　　　　　ここから難易度表本体　　　　　-->
<div class="tableflame">
<table align="center" cellspacing="1" cellpadding=2　border="0" bgcolor="#000000" id="table_int">
</table>
</div>

<script language="javascript" type="text/javascript">

// メニュー開閉
function menu(tName){
	var tMenu = document.getElementById(tName).style;
	if (tMenu.display == 'none'){
		tMenu.display = "block";
	}else{
		tMenu.display = "none";
	}
}

$(document).ready(function(){
	$.getJSON($("meta[name=bmstable]").attr("content"), function(header){
		$.getJSON(header.data_url, function(information){
			// headerのsort有無で分岐
			if(header["level_order"]){
				makeBMSTable(information,header.symbol,header["level_order"]);
			} else {
			makeBMSTable(information,header.symbol);
			}
		});
	});
});

// ソートのための引数追加
var searchableRows = [];
var searchSeparators = [];
var searchTimer = null;

// 簡易検索用文字列
function getSearchText(item) {
	return [
		item.title,
		item.artist,
		item.name_diff,
		item.md5,
		item.sha256
	].join(" ").toLowerCase();
}


// 描画済みの譜面行と難易度見出しを検索用に保持
function cacheSearchData(info) {
	searchableRows = [];
	searchSeparators = [];

	var currentSeparator = null;
	var itemIndex = 0;

	$("#table_int tr").each(function() {
		if($(this).hasClass("tr_separate")) {
			currentSeparator = {
				element: this,
				matchCount: 0
			};
			searchSeparators.push(currentSeparator);
			return;
		}

		if(itemIndex < info.length &&
			(this.className == "tr_normal" || /^state/.test(this.className))) {

			searchableRows.push({
				element: this,
				text: getSearchText(info[itemIndex]),
				parentSeparator: currentSeparator
			});

			itemIndex++;
		}
	});
}


// スマホは検索キーで実行し、空欄に戻したときは全件表示する
function isMobileSearch() {
 return window.matchMedia("(max-width: 480px), (max-device-width: 480px)").matches;
}

function handleSearchInput(event) {
 clearTimeout(searchTimer);
 if(event && event.isComposing) {
  return;
 }
 var input = document.getElementById("table-search-input");
 if(!isMobileSearch() || $.trim(input.value) == "") {
  filterTable();
 } else {
  document.getElementById("table-search-status").textContent = "検索キーで結果を更新";
 }
}

function handleSearchKeydown(event) {
 if(isMobileSearch() && event.key == "Enter" && !event.isComposing && event.keyCode != 229) {
  event.preventDefault();
  filterTable();
 }
}

// 簡易検索
function filterTable() {
	clearTimeout(searchTimer);

	searchTimer = setTimeout(function() {
		var input = document.getElementById("table-search-input");
		var status = document.getElementById("table-search-status");

		if(!input || !status) {
			return;
		}

		var query = $.trim(input.value.toLowerCase());
		var minLength = isMobileSearch() ? 3 : 2;
		var showAll = query.length < minLength;
		var totalMatches = 0;

		// 検索で表が縮んでも、ページ下端によるスクロール位置の補正を防ぐ
		var container = document.body;
		if(container) {
			container.style.minHeight = showAll ? "" :
				Math.max(0, window.innerHeight - container.getBoundingClientRect().top) + "px";
		}

		for(var i = 0; i < searchSeparators.length; i++) {
			searchSeparators[i].matchCount = 0;
		}

		for(var j = 0; j < searchableRows.length; j++) {
			var item = searchableRows[j];
			var isMatch = showAll || item.text.indexOf(query) != -1;

			var display = isMatch ? "" : "none";
			if(item.element.style.display != display) {
				item.element.style.display = display;
			}

			if(isMatch) {
				totalMatches++;

				if(item.parentSeparator) {
					item.parentSeparator.matchCount++;
				}
			}
		}

		for(var k = 0; k < searchSeparators.length; k++) {
			var separator = searchSeparators[k];

			var separatorDisplay = (showAll || separator.matchCount > 0) ? "" : "none";
			if(separator.element.style.display != separatorDisplay) {
				separator.element.style.display = separatorDisplay;
			}
		}

		if(query.length == 0) {
			status.innerHTML = "";
		} else if(query.length < minLength) {
			status.innerHTML = minLength + "文字以上入力してください";
		} else {
			status.innerHTML = totalMatches + " 件表示中";
		}
	}, 250);
}


function makeBMSTable(info, mark, order) {
	// orderが未指定の場合はnull
	if(typeof order === 'undefined'){
		order = null;
	}
	
    var x = "";
    var ev = "";
    var count = 0;
    var obj = $("#table_int");

	// ソート
	if(order != "" && order != null){
		// herder.jsonにsortが存在する場合は指定順->タイトル順にソート
		
		var orderAry = [];
		for(var l = 0; l < order.length; l++){
			orderAry.push(order[l].toString());
		}
		
		for(var j = 0; j < info.length; j++){
		    var index=orderAry.indexOf(info[j]["level"]);
		    info[j]["_index"]=index;
		}

		info.sort(function(a,b){
		    if(a["_index"] < b["_index"]){
				return -1;
		    } else if(a["_index"] > b["_index"]){
				return 1;
			} else if( a["title"].toLowerCase() < b["title"].toLowerCase() ){
				return -1;
			} else if( a["title"].toLowerCase() > b["title"].toLowerCase() ){
				return 1;
			} else {
	　	　　	return 0;
			}
		});
		for(var k=0; k < info.length; k++){
			delete info[k]["_index"];
		}
	} else {
		// そうでない場合はレベル順->タイトル順にソート
		info.sort(
			function(a,b){
				var aLv = a["level"].toString();
				var bLv = b["level"].toString();
				if(isNaN(a["level"]) == false && isNaN(b["level"]) == false){
					return a["level"]-b["level"];
				} else if( aLv < bLv ){
					return -1;
				} else if( aLv > bLv ){
					return 1;
				} else if( a["title"].toLowerCase() < b["title"].toLowerCase() ){
					return -1;
				} else if( a["title"].toLowerCase() > b["title"].toLowerCase() ){
					return 1;
				} else {
		　	　　	return 0;
				}
			}
		);
	}
	
    // 表のクリア
    obj.html("");
    $("<tr height='20' style='color:white;background-color:#666666'><td align='center'>LV</td><td align='center'>譜面</td><td colspan='6' align='center'>IR</td><td align='center'>タイトル</td><td align='center'>ジャンル</td><td align='center'>本体</td><td align='center'>keys</td><td align='center'>notes</td></tr>").appendTo(obj);
    var obj_sep = null;
    for (var i = 0; i < info.length; i++) {
        // 難度ごとの区切り
        if (x != info[i].level) {
            // 前の区切りに譜面数、平均密度を追加
          	if (obj_sep != null) {
                obj_sep.html("<td colspan='13' align='center'>" + "<b>" + mark + x + " (" + count + "譜面)</b></td>");
            }
            obj_sep = $("<tr class='tr_separate' id='" + mark + info[i].level + "'></tr>");
            obj_sep.appendTo(obj);
            count = 0;
            x = info[i].level;
        }
        // 本文
        var str = $("<tr class='tr_normal'></tr>");

        if(info[i].state == 1) {
        str = $("<tr class='state1'></tr>");
        }
        if(info[i].state == 2) {
        str = $("<tr class='state2'></tr>");
        }
        if(info[i].state == 3) {
        str = $("<tr class='state3'></tr>");
        }
        if(info[i].state == 4) {
        str = $("<tr class='state4'></tr>");
        }
        if(info[i].state == 5) {
        str = $("<tr class='state5'></tr>");
        }
        if(info[i].state == 6) {
        str = $("<tr class='state6'></tr>");
	}
        if(info[i].state == 7) {
        str = $("<tr class='state7'></tr>");
        }

        // レベル表記
        $("<td width='2%'>" + mark + x + "</td>").appendTo(str);

　　　　// 譜面画像
　　　　$("<td width='1%' align='center'><a href='https://bms-score-viewer.pages.dev/view?md5=" + info[i].md5 + "' target='_blank'>♪</a></td>").appendTo(str);

　　　　// Mocha Repository
　　　　$("<td width='1%' align='center'><a href='https://mocha-repository.info/song.php?sha256=" + info[i].sha256 + "' target='_blank'><img src='../../style/mochair_logo.gif' border='0' alt='Mocha Repository' /></a></td>").appendTo(str);

　　　　// MinIR
　　　　$("<td width='1%' align='center'><a href='https://www.gaftalk.com/minir/#/viewer/song/" + info[i].sha256 + "/0' target='_blank'><img src='../../style/minir_logo.gif' border='0' alt='MinIR' /></a></td>").appendTo(str);

　　　　// BMS-IR
　　　　$("<td width='1%' align='center'><a href='https://bms-ir.org/new/song?songmd5=" + info[i].md5 + "' target='_blank'><img src='../../style/bmsir_logo.gif' border='0' alt='BMS-IR' /></a></td>").appendTo(str);

　　　　// rianIR
　　　　$("<td width='1%' align='center'><a href='https://rianir.link/pages/ranking/ranking.php?sha256=" + info[i].sha256 + "' target='_blank'><img src='../../style/rianir_logo.gif' border='0' alt='rianIR' /></a></td>").appendTo(str);

　　　　// STELLAVERSE IR
　　　　$("<td width='1%' align='center'><a href='https://ir.stellabms.xyz/charts/" + info[i].md5 + "' target='_blank'><img src='../../style/stellaverseir_logo.gif' border='0' alt='STELLAVERSE IR' /></a></td>").appendTo(str);　　　　// Kaleid IR
　　　　$("<td width='1%' align='center'><a href='https://kaleidir.com/charts/" + info[i].sha256 + "' target='_blank'><img src='../../style/kaleidir_logo.gif' border='0' alt='Kaleid IR' /></a></td>").appendTo(str);

        // タイトル
        $("<td width='15%'>" + "<a href='https://lr2ir.com/charts/" + info[i].md5 + "' target='_blank'>" + info[i].title + "</a></td>").appendTo(str);

        //ジャンル
        $("<td width='5%'>" + info[i].genre + "</td>").appendTo(str);

        // アーティスト
        var astr = "";
        if(info[i].url != "" && info[i].url != null) {
        	if(info[i].artist != "" && info[i].artist != null) {
        		astr = "<a href='" + info[i].url + "'>" + info[i].artist + "</a>";
        	} else {
        		astr = "<a href='" + info[i].url + "'>" + info[i].url + "</a>";
        	}
        } else {
        	if(info[i].artist != "" && info[i].artist != null) {
        		astr = info[i].artist;
        	}
        }
        if(info[i].url_pack != "" && info[i].url_pack != null) {
        	if(info[i].name_pack != "" && info[i].name_pack != null) {
        		astr += "<br />(<a href='" + info[i].url_pack + "'>" + info[i].name_pack + "</a>)";
        	} else {
        		astr += "<br />(<a href='" + info[i].url_pack + "'>" + info[i].url_pack + "</a>)";
        	}
        } else {
        	if(info[i].name_pack != "" && info[i].name_pack != null) {
        		astr += "<br />(" + info[i].name_pack + ")";
        	}
        }
        $("<td width='15%'>" + astr + "</td>").appendTo(str);

        //keys
        $("<td width='3%'>" + info[i].mode + "</td>").appendTo(str);

        //notes
        $("<td width='5%'>" + info[i].notes + "</td>").appendTo(str);

        str.appendTo(obj);
        count++;
    }

    
    // 最後の区切り処理
	// マークが抜け落ちてたので追加
    if (obj_sep != null) {
        obj_sep.html("<td colspan='13' align='center'>" + "<b>" + mark + x + " (" + count + "譜面)</b></td>");
    }

	// 簡易検索用データを保持
	cacheSearchData(info);
	filterTable();
}
</script>


</div>
